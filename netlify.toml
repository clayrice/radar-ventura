[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

[functions]
  directory = "netlify/functions"

[functions."radar-daily"]
  schedule = "0 9,11,12,14,17,20,23 * * *"

[functions."radar-weekly"]
  schedule = "15 11-23 * * *"

[functions."radar-instagram"]
  schedule = "0 10 * * *"
