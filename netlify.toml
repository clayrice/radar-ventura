[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
  # Public configuration strings, never credentials. Keep scanning all real secrets.
  SECRETS_SCAN_OMIT_KEYS = "BILLING_PRODUCTS,OPENAI_MODEL,ASAAS_ENV"

[functions]
  directory = "netlify/functions"

[functions."radar-daily"]
  schedule = "0 9,11,12,14,17,20,23 * * *"

[functions."radar-weekly"]
  schedule = "15 11-23 * * *"

# After collection, with later retries using the existing per-recipient ledger.
# Dispatch remains dormant while DAILY_EMAIL_SEND_ENABLED is false.
[functions."radar-daily-email"]
  schedule = "45 9,11,12,14,17,20,23 * * *"

[functions."radar-instagram"]
  schedule = "0 10 * * *"
